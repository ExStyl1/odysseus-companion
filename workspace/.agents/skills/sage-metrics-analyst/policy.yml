---
merge_request:
  method: fast-forward
  auto_rebase: always
project:
  commit_template:
    squash: '%{first_commit}'
push_rules:
  branch_name: ^[A-Z]+-\d+((\-\w+)+|\-([A-Z][a-z0-9]+)+)$
  commit_message: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)((?:\([^()\\r\\n]*[a-z]+\)|\()?(!)?)(: [A-Z]{3,6}-\d+\s.*)?$'
  files_restrictions: .*\.env
