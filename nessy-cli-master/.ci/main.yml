plugin_intellij_build:
  stage: build
  image: ${GRADLE_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/intellij-ide-companion/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^release-cli-/
      when: never
    - when: on_success
  needs:
    - job: set_stable_version
      optional: true
      artifacts: true
    - job: download_idea
      artifacts: true
    - job: plugin_intellij_webview_build
      artifacts: true
  before_script:
    - mkdir -p binary/ideaIC
    - tar -xzf binary/${IDEA_ARCHIVE} -C binary/ideaIC
    - export INTELLIJ_PLATFORM_PATH="$(pwd)/binary/ideaIC/${IDEA_BUILD_NUMBER}"
  script:
    # В чистом контейнере инкрементальная компиляция бесполезна, а её снапшоты classpath
    # IntelliJ Platform съедают heap и валят билд по OOM. Заодно компилируем внутри
    # Gradle daemon, чтобы не держать вторую JVM (Kotlin daemon) под лимитом памяти пода.
    - gradle -p packages/intellij-ide-companion buildPlugin --build-cache
      -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process
      -PintellijPlatformPath="$INTELLIJ_PLATFORM_PATH"
    - PLUGIN_VERSION=$(grep -E '^pluginVersion=' packages/intellij-ide-companion/gradle.properties | head -1 | cut -d= -f2)
    - PLUGIN_ARCHIVE_BASE_NAME=$(grep -E '^pluginArchiveBaseName=' packages/intellij-ide-companion/gradle.properties | head -1 | cut -d= -f2)
    - EXTENSION_FILENAME="${PLUGIN_ARCHIVE_BASE_NAME}-${PLUGIN_VERSION}.zip"
    - echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> build_variables.sh
    - echo "EXTENSION_FILENAME=$EXTENSION_FILENAME" >> build_variables.sh
    - mv ./packages/intellij-ide-companion/build/distributions/$EXTENSION_FILENAME ./$EXTENSION_FILENAME
  artifacts:
    paths:
      - './nessy-intellij-ide-companion*.zip'
      - './build_variables.sh'
  cache:
    key: 'gradle-cache-$GRADLE_CACHE_VERSION'
    paths:
      - .gradle/caches/modules-2
      - .gradle/wrapper
    policy: pull-push

# --- Pre-publish stage ---

# Creates a release tag from master branch.
# CLI/Desktop/SDK-Java: tag is formed from committed version (with prerelease suffix check for beta releases).
# SDK-TypeScript/SDK-Python: version is computed by per-package get-release-version.js
#   (RELEASE_TYPE=beta -> --type=preview, stable -> --type=stable). Tag uses -preview.N suffix.
createTag:
  stage: pre-publish
  image: ${NODE_IMAGE}
  variables:
    PYPI_REGISTRY_URL: 'https://artifactory.tcsbank.ru/artifactory/api/pypi/python-all/simple/'
    NPM_REGISTRY_URL: 'https://artifactory.tcsbank.ru/artifactory/api/npm/npm-hosted/'
  script:
    - dp auth service-acc --key-file $GITLAB_NESTOR_DEVELOPER
    - GITLAB_TOKEN=$(dp auth print-token)
    # Install native modules for Linux (npm/cli#4828 optional dependencies bug)
    # This job doesn't need build, just scripts - skip prepare
    - npm ci --ignore-scripts
    - npm i --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    - |
      # Determine target version
      if [ "$COMPONENT_TYPE" = "sdk-typescript" ] || [ "$COMPONENT_TYPE" = "sdk-python" ]; then
        # GitHub-style: compute version via per-package script
        if [ "$RELEASE_TYPE" = "stable" ]; then
          VERSION_TYPE="stable"
        else
          VERSION_TYPE="preview"
        fi
        SCRIPT_PATH="packages/${COMPONENT_TYPE}/scripts/get-release-version.js"
        VERSION_JSON=$(node "$SCRIPT_PATH" --type="$VERSION_TYPE")
        CURRENT_VERSION=$(echo "$VERSION_JSON" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).releaseVersion")
        echo "Computed ${COMPONENT_TYPE} ${VERSION_TYPE} version: ${CURRENT_VERSION}"
      elif [ "$COMPONENT_TYPE" = "cli" ] || [ "$COMPONENT_TYPE" = "desktop" ]; then
        if [ "$COMPONENT_TYPE" = "desktop" ]; then
          VERSION_FILE="./packages/desktop/package.json"
        else
          VERSION_FILE="./package.json"
        fi
        CURRENT_VERSION=$(node -p "require('$VERSION_FILE').version")
        if [ "$RELEASE_TYPE" = "stable" ]; then
          CURRENT_VERSION=$(echo "$CURRENT_VERSION" | sed 's/-.*//')
        elif [ "$RELEASE_TYPE" = "beta" ]; then
          if ! echo "$CURRENT_VERSION" | grep -q "beta"; then
            echo "ERROR: RELEASE_TYPE=beta selected but committed ${COMPONENT_TYPE} version '${CURRENT_VERSION}' has no -beta suffix."
            echo "Bump version to a beta (e.g. ${CURRENT_VERSION}-beta.0) in the source files and push to master before releasing."
            exit 1
          fi
        fi
      elif [ "$COMPONENT_TYPE" = "sdk-java" ]; then
        ORIGINAL_VERSION=$(grep '<version>' packages/sdk-java/nessycli/pom.xml | head -1 | sed -E 's|.*<version>([^<]+)</version>.*|\1|')
        CURRENT_VERSION="$ORIGINAL_VERSION"
        # For Java SDK, version in master is always X.Y.Z-SNAPSHOT
        # Stable release: strip -SNAPSHOT for tag (0.0.3-SNAPSHOT -> 0.0.3)
        # Beta release: keep -SNAPSHOT (0.0.3-SNAPSHOT)
        if [ "$RELEASE_TYPE" = "stable" ]; then
          # Remove -SNAPSHOT suffix for stable tag
          CURRENT_VERSION=$(echo "$ORIGINAL_VERSION" | sed 's/-SNAPSHOT$//')
        elif [ "$RELEASE_TYPE" = "beta" ]; then
          # Verify SNAPSHOT suffix exists for beta release
          if ! echo "$ORIGINAL_VERSION" | grep -q "SNAPSHOT"; then
            echo "ERROR: sdk-java version '${ORIGINAL_VERSION}' must have -SNAPSHOT suffix in master."
            echo "Bump version to ${ORIGINAL_VERSION}-SNAPSHOT in pom.xml and push to master."
            exit 1
          fi
        fi
      else
        echo "Unsupported component type: $COMPONENT_TYPE"
        exit 1
      fi
    - TAG_NAME="release-${COMPONENT_TYPE}-${CURRENT_VERSION}"
    # Check if tag already exists on remote and increment if needed
    - |
      FINAL_VERSION="$CURRENT_VERSION"
      if [ "$COMPONENT_TYPE" = "sdk-python" ] || [ "$COMPONENT_TYPE" = "sdk-typescript" ]; then
        # For SDKs, check if tag exists on remote and increment preview number
        COUNTER=0
        while git ls-remote --tags origin "refs/tags/release-${COMPONENT_TYPE}-${FINAL_VERSION}" | grep -q "refs/tags"; do
          COUNTER=$((COUNTER + 1))
          if echo "$CURRENT_VERSION" | grep -q "preview"; then
            # Increment preview number: 0.1.0-preview.0 -> 0.1.0-preview.1
            BASE=$(echo "$CURRENT_VERSION" | sed -E 's/-preview\.[0-9]+$//')
            FINAL_VERSION="${BASE}-preview.${COUNTER}"
          else
            # For stable releases, add preview suffix
            FINAL_VERSION="${CURRENT_VERSION}-preview.${COUNTER}"
          fi
          if [ $COUNTER -gt 100 ]; then
            echo "ERROR: Too many existing tags, manual intervention required"
            exit 1
          fi
        done
      elif [ "$COMPONENT_TYPE" = "sdk-java" ]; then
        # For Java SDK, increment SNAPSHOT index: 0.0.3-SNAPSHOT -> 0.0.3-SNAPSHOT.0 -> 0.0.3-SNAPSHOT.1
        # Stable versions don't need index (0.0.3 stays 0.0.3)
        if echo "$CURRENT_VERSION" | grep -q "SNAPSHOT"; then
          COUNTER=0
          while git ls-remote --tags origin "refs/tags/release-${COMPONENT_TYPE}-${FINAL_VERSION}" | grep -q "refs/tags"; do
            if [ $COUNTER -eq 0 ]; then
              # First conflict: add .0 suffix
              FINAL_VERSION="${CURRENT_VERSION}.0"
            else
              # Subsequent conflicts: increment index
              FINAL_VERSION="${CURRENT_VERSION}.${COUNTER}"
            fi
            COUNTER=$((COUNTER + 1))
            if [ $COUNTER -gt 100 ]; then
              echo "ERROR: Too many existing tags, manual intervention required"
              exit 1
            fi
          done
        fi
        # For stable versions, no index needed - tag as-is
      fi
      TAG_NAME="release-${COMPONENT_TYPE}-${FINAL_VERSION}"
      echo "Creating tag ${TAG_NAME}"
      git tag "$TAG_NAME"
      git push "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$TAG_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $MASTER_BRANCH

# --- Publish stage ---

publish_intellij_plugin_beta:
  stage: publish
  image: ${S3_TOOLS_IMAGE}
  needs:
