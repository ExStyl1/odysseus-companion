    - ACTUAL_VERSION=$(node -p "require('./dist/package.json').version")
    - test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
    - cd dist && npm publish --registry=https://artifactory.tcsbank.ru/artifactory/api/npm/npm-hosted/
  needs:
    - job: set_stable_version
      artifacts: true
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-cli-[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never

# --- SDK Publish Jobs ---

publish_sdk_typescript:
  stage: publish
  image: ${NODE_IMAGE}
  needs:
    - job: build_sdk_typescript
      artifacts: true
    - job: test_sdk_typescript
  before_script:
    - dp auth service-acc --key-file $nessy_cli_publish_artifactory
    - dp auth configure-npm --ci
  script:
    - TAG_VERSION=$(echo "$CI_COMMIT_TAG" | sed -E 's/^release-sdk-typescript-//')
    - |
      if echo "$TAG_VERSION" | grep -q "preview"; then
        NPM_TAG="preview"
      else
        NPM_TAG="latest"
      fi
    - 'echo "Releasing sdk-typescript ${TAG_VERSION} (npm dist-tag: ${NPM_TAG})"'
    # Install native modules for Linux (npm/cli#4828 optional dependencies bug)
    # Rollup and esbuild need platform-specific native binaries for bundling
    - npm ci --ignore-scripts
    - npm version -w @nestor/nessy-cli-sdk "$TAG_VERSION" --no-git-tag-version --allow-same-version
    - npm i --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    - npm run build -- --cli-only
    # Rebuild bundle with the bumped version (in case tag was pushed manually, bypassing build stage)
    - npm run bundle
    - cd packages/sdk-typescript
    - npm run build
    - node scripts/bundle-cli.js
    # Unit tests
    - npm run test:ci
    # Record bundled CLI version
    - CLI_VERSION=$(node -p "require('../../packages/cli/package.json').version")
    - echo "${CLI_VERSION}" > dist/BUNDLED_CLI_VERSION
    - echo "Bundled CLI version - ${CLI_VERSION}"
    - npm publish --tag="$NPM_TAG" --registry=https://artifactory.tcsbank.ru/artifactory/api/npm/npm-hosted/
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-sdk-typescript-[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$/
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $MASTER_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "sdk-typescript"
      when: never

publish_sdk_python:
  stage: publish
  image: ${PYTHON_IMAGE}
  needs:
    - job: build_sdk_python
      artifacts: true
  variables:
    ARTIFACTORY_FOLDER: '${CI_PROJECT_ROOT_NAMESPACE}'
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e 'packages/sdk-python[dev]' build
    - dp auth service-acc --key-file $nessy_cli_publish_artifactory
  script:
    - TAG_VERSION=$(echo "$CI_COMMIT_TAG" | sed -E 's/^release-sdk-python-//')
    # Convert tag version to PEP 440 package version: X.Y.Z-preview.N -> X.Y.ZrcN
    - PACKAGE_VERSION=$(echo "$TAG_VERSION" | sed -E 's/-preview\.([0-9]+)$/rc\1/')
    - 'echo "Releasing sdk-python ${TAG_VERSION} (PEP 440 package version: ${PACKAGE_VERSION})"'
    - sed -i "s/^version = \".*\"/version = \"$PACKAGE_VERSION\"/" packages/sdk-python/pyproject.toml
    # Quality gates (also run in lint/test stages; repeated here for manually-created release tags)
    - python -m ruff check --config packages/sdk-python/pyproject.toml packages/sdk-python
    - python -m ruff format --check --config packages/sdk-python/pyproject.toml packages/sdk-python
    - python -m mypy --config-file packages/sdk-python/pyproject.toml packages/sdk-python/src
    - python -m pytest -c packages/sdk-python/pyproject.toml packages/sdk-python/tests -q
    # Note: smoke test already ran in test_sdk_python, skipping here to avoid redundant xz-utils dependency
    - rm -rf packages/sdk-python/dist
    - cd packages/sdk-python
    - python -m build
    # Version already validated by get-release-version.js in createTag job
    # Publish to Artifactory via curl
    - |
      if [[ -z "${DP_SA_ACCOUNT_NAME}" ]]; then
        echo "Ошибка: необходимо установить переменную DP_SA_ACCOUNT_NAME"
        exit 1
      fi
      PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])" 2>/dev/null || python -c "import toml; print(toml.load('pyproject.toml')['tool']['poetry']['name'])")

      # Check if version already exists in Artifactory (prevent accidental re-publish)
      echo "Checking if version ${PACKAGE_VERSION} already exists in Artifactory..."
      ARTIFACTORY_CHECK=$(curl -s -o /dev/null -w "%{http_code}" \
        -u "$DP_SA_ACCOUNT_NAME:$(dp supporting get-artifactory-token)" \
        "https://artifactory.tcsbank.ru/artifactory/api/storage/python-hosted/$ARTIFACTORY_FOLDER/$PACKAGE_NAME/$PACKAGE_VERSION")
      if [ "$ARTIFACTORY_CHECK" = "200" ]; then
        echo "ERROR: Version ${PACKAGE_VERSION} already exists in Artifactory at $ARTIFACTORY_FOLDER/$PACKAGE_NAME/$PACKAGE_VERSION"
        echo "Cannot re-publish existing version. Please increment version number."
        exit 1
      fi

      echo "Publishing package: $PACKAGE_NAME version: $PACKAGE_VERSION to artifactory/python-hosted/$ARTIFACTORY_FOLDER/"
      UPLOAD_FAILED=0
      for file in dist/*; do
        if [ -f "$file" ]; then
          echo "Uploading: $file"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "$DP_SA_ACCOUNT_NAME:$(dp supporting get-artifactory-token)" \
            -X PUT "https://artifactory.tcsbank.ru/artifactory/python-hosted/$ARTIFACTORY_FOLDER/$PACKAGE_NAME/$PACKAGE_VERSION/$(basename "$file")" \
            -T "$file")
          echo "Upload response: $HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Failed to upload $(basename "$file") - HTTP $HTTP_CODE"
            UPLOAD_FAILED=1
          fi
        fi
      done

      if [ "$UPLOAD_FAILED" = "1" ]; then
        echo "ERROR: Publishing failed. Check authentication and Artifactory permissions."
        exit 1
      fi

      echo "Done publishing to Artifactory"
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-sdk-python-[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$/
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $MASTER_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "sdk-python"
      when: never

publish_sdk_java:
  stage: publish
  image: ${JAVA_IMAGE}
  needs:
    - job: build_sdk_java
      artifacts: true
    - job: test_sdk_java
  before_script:
    - dp auth service-acc --key-file $nessy_cli_publish_artifactory
    - dp auth configure-maven --ci -config-path packages/sdk-java/nessycli/settings.xml
  script:
    # Extract version from tag
    - TAG_VERSION=$(echo "$CI_COMMIT_TAG" | sed -E 's/^release-sdk-java-//')
    # Determine publish version based on tag type
    - |
      echo "Tag version: ${TAG_VERSION}"
      if echo "$TAG_VERSION" | grep -q "SNAPSHOT"; then
        # SNAPSHOT release: remove index (0.0.3-SNAPSHOT.0 -> 0.0.3-SNAPSHOT)
        PUBLISH_VERSION=$(echo "$TAG_VERSION" | sed -E 's/^(.*-SNAPSHOT)(\.[0-9]+)?$/\1/')
      else
        # Stable release: use version as-is (0.0.3)
        PUBLISH_VERSION="$TAG_VERSION"
      fi
      echo "Publishing Java SDK version: ${PUBLISH_VERSION}"
    # Navigate to SDK directory and set version
    - cd packages/sdk-java/nessycli
    - mvn versions:set -DnewVersion=${PUBLISH_VERSION} -DgenerateBackupPoms=false
    # Publish nessy-cli-sdk module (main Java SDK for Nessy CLI)
    - mvn deploy -s settings.xml -Dmaven.test.skip=true -DskipTests
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-sdk-java-[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT(\.[0-9]+)?)?$/
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $MASTER_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "sdk-java"
      when: never
publish_vscode_extension:
  stage: publish
  image: ${S3_TOOLS_IMAGE}
  script:
    - source packages/vscode-ide-companion/build-variables.sh
    - VSIX_PATH="packages/vscode-ide-companion/${VSIX_FILENAME}"
    - test -f "${VSIX_PATH}"
    - s3cmd put "${VSIX_PATH}" "s3://${AWS_BUCKET_DIR}/vscode/${VSIX_FILENAME}"
    - |
      if [[ "${VSCODE_VERSION}" =~ -beta\. ]]; then
        s3cmd put "${VSIX_PATH}" s3://${AWS_BUCKET_DIR}/vscode/nessy-cli-vscode-ide-companion-latest-beta.vsix
        s3cmd put packages/vscode-ide-companion/latest.json s3://${AWS_BUCKET_DIR}/vscode/latest-beta.json
      else
        s3cmd put "${VSIX_PATH}" s3://${AWS_BUCKET_DIR}/vscode/nessy-cli-vscode-ide-companion-latest.vsix
        s3cmd put packages/vscode-ide-companion/latest.json s3://${AWS_BUCKET_DIR}/vscode/latest.json
      fi
  needs:
    - job: build_vscode_extension
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-cli-/
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never

publish_intellij_plugin:
  stage: publish
  image: ${S3_TOOLS_IMAGE}
  script:
    - source ./build_variables.sh
    - s3cmd put ./"$EXTENSION_FILENAME" s3://${AWS_BUCKET_DIR}/jetbrains/nessy-intellij-ide-companion-latest.zip
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-cli-[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never
  needs:
    - job: plugin_intellij_build
      artifacts: true

# --- Release stage ---
# update jetbrains version information
intellij_download_update_file_xml:
  stage: release
  image: ${S3_TOOLS_IMAGE}
  script:
    - s3cmd get s3://${AWS_BUCKET_DIR}/release/jetbrains/updatePlugin.xml packages/intellij-ide-companion/updatePlugin.xml || (echo '<plugins/>' > packages/intellij-ide-companion/updatePlugin.xml && echo 'Created new updatePlugin.xml (no existing file in S3).')
  artifacts:
    paths:
      - 'packages/intellij-ide-companion/updatePlugin.xml'
  rules: *release_cli_stable_rules

intellij_update_plugin_xml:
  stage: release
  image: ${GRADLE_IMAGE}
  needs:
    - intellij_download_update_file_xml
  script:
    - ./packages/intellij-ide-companion/gradlew -p packages/intellij-ide-companion updateLocalPluginXml -PupdatePluginXmlPath=updatePlugin.xml
  artifacts:
    paths:
      - 'packages/intellij-ide-companion/updatePlugin.xml'
  rules: *release_cli_stable_rules

plugin_intellij_release:
  stage: release
  image: ${S3_TOOLS_IMAGE}
  needs:
    - intellij_update_plugin_xml
    - plugin_intellij_build
  script:
    - source ./build_variables.sh
    - |
      # Извлекаем версию из тега (например, release-cli-0.11.0 -> 0.11.0, release-jetbrains-0.11.0-beta.1 -> 0.11.0-beta.1)
      if [[ $CI_COMMIT_TAG =~ ^release-[a-z]+-(.+)$ ]]; then
        RELEASE_VERSION="${BASH_REMATCH[1]}"
      fi
      if [ $PLUGIN_VERSION != $RELEASE_VERSION ]; then
        echo "Version of release differs from build version"
        exit 1
      fi
    - RELEASE_URL="s3://${AWS_BUCKET_DIR}/release/jetbrains/"
    - s3cmd put "./$EXTENSION_FILENAME" $RELEASE_URL
    - s3cmd put "./$EXTENSION_FILENAME" "${RELEASE_URL}nessy-intellij-ide-companion-latest-since-233.zip"
    - s3cmd put ./packages/intellij-ide-companion/updatePlugin.xml $RELEASE_URL
  rules: *release_cli_stable_rules

# --- Post-publish stage ---

# Bumps version after a release tag pipeline.
# For beta tags - increments the beta prerelease number (e.g. 1.2.3-beta.0 -> 1.2.3-beta.1).
# For stable tags - bumps patch and adds beta prerelease (e.g. 1.2.3 -> 1.2.4-beta.0).
# Creates a MR to master and auto-merges it (since approval is optional).
commitVersion:
  stage: post-publish
  image: ${NODE_IMAGE}
  variables:
    GIT_STRATEGY: clone
    GIT_CHECKOUT: 'true'
  script:
    - dp auth service-acc --key-file $GITLAB_NESTOR_DEVELOPER
    - GITLAB_TOKEN=$(dp auth print-token)
    - COMPONENT_TYPE=$(echo "$CI_COMMIT_TAG" | sed -E 's/^release-(cli|desktop|sdk-typescript|sdk-python|sdk-java)-.*/\1/')
    - TAG_VERSION=$(echo "$CI_COMMIT_TAG" | sed -E "s/^release-${COMPONENT_TYPE}-//")
    - |
      # Determine NEXT_VERSION per component:
      # - SDK TS/Python: bump to next snapshot/preview version after any release.
      # - SDK Java: SNAPSHOT tags keep same base, stable tags bump to next SNAPSHOT.
      # - CLI/Desktop: bump to next beta (prerelease for beta tags, prepatch+beta for stable tags).
      if [ "$COMPONENT_TYPE" = "sdk-typescript" ] || [ "$COMPONENT_TYPE" = "sdk-python" ]; then
        # Bump to next preview version for all SDK releases
        if [ "$COMPONENT_TYPE" = "sdk-python" ]; then
          # Python PEP 440 format: 1.0.1rc0
          NEXT_VERSION_SEMVER=$(npx semver "$TAG_VERSION" -i prepatch --preid preview)
          NEXT_VERSION=$(echo "$NEXT_VERSION_SEMVER" | sed -E 's/-preview\.([0-9]+)$/rc\1/')
          echo "Release ${TAG_VERSION} -> bumping to ${NEXT_VERSION} (PEP 440) for MR"
        else
          # TypeScript npm format: 1.0.1-preview.0
          NEXT_VERSION=$(npx semver "$TAG_VERSION" -i prepatch --preid preview)
          echo "Release ${TAG_VERSION} -> bumping to ${NEXT_VERSION} for MR"
        fi
      elif [ "$COMPONENT_TYPE" = "sdk-java" ]; then
        # Java SDK: SNAPSHOT tags keep same base, stable tags bump to next SNAPSHOT
        if echo "$TAG_VERSION" | grep -q "SNAPSHOT"; then
          # SNAPSHOT release: keep base version (0.0.3-SNAPSHOT.0 -> 0.0.3-SNAPSHOT)
          NEXT_VERSION=$(echo "$TAG_VERSION" | sed -E 's/^(.*-SNAPSHOT)(\.[0-9]+)?$/\1/')
          echo "SNAPSHOT release ${TAG_VERSION} -> keeping ${NEXT_VERSION} for MR"
        else
          # Stable release: bump to next SNAPSHOT (0.0.3 -> 0.0.4-SNAPSHOT)
          BASE_VERSION=$(echo "$TAG_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          NEXT_VERSION_SEMVER=$(npx semver "$BASE_VERSION" -i minor --preid SNAPSHOT)
          # Convert npm format (0.0.4-SNAPSHOT.0) to Maven format (0.0.4-SNAPSHOT)
          NEXT_VERSION=$(echo "$NEXT_VERSION_SEMVER" | sed -E 's/-SNAPSHOT\.[0-9]+$/-SNAPSHOT/')
          echo "Stable release ${TAG_VERSION} -> bumping to ${NEXT_VERSION} (SNAPSHOT) for MR"
        fi
      else
        # CLI/Desktop
        if echo "$TAG_VERSION" | grep -q "beta"; then
          NEXT_VERSION=$(npx semver "$TAG_VERSION" -i prerelease --preid beta)
        else
          NEXT_VERSION=$(npx semver "$TAG_VERSION" -i prepatch --preid beta)
        fi
      fi
    - git config user.email "ci@gitlab.com"
    - git config user.name "CI Bot"
    - BRANCH_NAME="ci/bump-${COMPONENT_TYPE}-${NEXT_VERSION}"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin ${MASTER_BRANCH}
    - git checkout -b "$BRANCH_NAME" origin/${MASTER_BRANCH}
    # Install native modules for Linux (npm/cli#4828 optional dependencies bug)
    # This job doesn't need build, just scripts - skip prepare
    - npm ci --ignore-scripts
    - npm i --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    - |
      # Bump version files for the released component only
      if [ "$COMPONENT_TYPE" = "cli" ]; then
        npm run release:version "$NEXT_VERSION"
        git add package.json package-lock.json packages/*/package.json packages/intellij-ide-companion/gradle.properties
      elif [ "$COMPONENT_TYPE" = "desktop" ]; then
        npm install -g bun
        cd packages/desktop
        bun run bump-desktop-version "$NEXT_VERSION"
        cd ../..
        git add packages/desktop/package.json packages/desktop/apps/electron/package.json packages/desktop/packages/shared/package.json
      elif [ "$COMPONENT_TYPE" = "sdk-typescript" ]; then
        node -e "const fs=require('fs');const p='packages/sdk-typescript/package.json';const j=JSON.parse(fs.readFileSync(p));j.version='$NEXT_VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
        git add packages/sdk-typescript/package.json
      elif [ "$COMPONENT_TYPE" = "sdk-python" ]; then
        sed -i "s/^version = \".*\"/version = \"$NEXT_VERSION\"/" packages/sdk-python/pyproject.toml
        git add packages/sdk-python/pyproject.toml
      elif [ "$COMPONENT_TYPE" = "sdk-java" ]; then
        # Java Maven version format: 1.0.1-SNAPSHOT
        sed -i "0,/<version>.*<\/version>/s|<version>.*</version>|<version>$NEXT_VERSION</version>|" packages/sdk-java/nessycli/pom.xml
        git add packages/sdk-java/nessycli/pom.xml
      else
        echo "Unsupported component type: $COMPONENT_TYPE"
        exit 1
      fi
    - git commit -m "chore - bump ${COMPONENT_TYPE} version to ${NEXT_VERSION}"
    - git push origin "$BRANCH_NAME"
    - |
      ASSIGNEE_PARAM=""
      if [ -n "$MR_ASSIGNEE_ID" ]; then
        ASSIGNEE_PARAM="--data-urlencode assignee_id=${MR_ASSIGNEE_ID}"
      fi
      MR_RESPONSE=$(curl --fail --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data-urlencode "source_branch=${BRANCH_NAME}" \
        --data-urlencode "target_branch=${MASTER_BRANCH}" \
        --data-urlencode "title=chore - bump ${COMPONENT_TYPE} version to ${NEXT_VERSION}" \
        --data-urlencode "remove_source_branch=true" \
        $ASSIGNEE_PARAM \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests")
      MR_IID=$(echo "$MR_RESPONSE" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).iid")
      echo "Created MR !${MR_IID}"
    - |
      echo "Waiting for MR to become mergeable..."
      for i in $(seq 1 60); do
        sleep 10
        MERGE_STATUS=$(curl --silent --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}" \
          | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).detailed_merge_status||'unknown'")
        echo "Attempt ${i} - merge status - ${MERGE_STATUS}"
        if [ "$MERGE_STATUS" = "mergeable" ] || [ "$MERGE_STATUS" = "ci_still_running" ]; then
          curl --fail --request PUT \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --data "merge_when_pipeline_succeeds=true" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge"
          echo "Auto-merge enabled for MR !${MR_IID}"
          exit 0
        fi
      done
      echo "MR not mergeable after 60 attempts"
      exit 1
  rules: *release_rules

# --- Autodoc ---

# Используем свежую версию autodoc 2
.unic/pipelines/templates/variables/auto-docs-image-version:
  variables:
    AUTO_DOCS_IMAGE_VERSION: 2
    AUTODOC_EXPERIMENTAL_NESTOR_LOCAL_SEARCH: 'true'
    AUTODOC_IMAGE_NAME: autodoc-experimental-search

.autodoc/extensions/scripts/autodoc-before-script:
  script:
    - rm -rf docs
    - mv docs-ru docs

pages:
  variables:
    AUTODOC_EXPERIMENTAL_FASTER: 'true'

Checking auto documentation:
  variables:
    AUTODOC_EXPERIMENTAL_FASTER: 'true'
  extends:
    - '.autodoc/jobs/autodoc::test'
