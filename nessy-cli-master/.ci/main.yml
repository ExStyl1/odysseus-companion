  before_script:
    - dp auth service-acc --key-file $nessy_cli_publish_artifactory
    - dp auth configure-npm --ci
  script:
    - npm run prepare:package
    - cd dist && npm publish --tag beta --registry=https://artifactory.tcsbank.ru/artifactory/api/npm/npm-hosted/
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-cli-\d+\.\d+\.\d+-beta/

publish_cli:
  stage: publish
  image: ${NODE_IMAGE}
  before_script:
    - dp auth service-acc --key-file $nessy_cli_publish_artifactory
    - dp auth configure-npm --ci
  script:
