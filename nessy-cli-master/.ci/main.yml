publish_standalone:
  stage: publish
  image: ${S3_TOOLS_IMAGE}
  needs:
    - job: build_standalone
      artifacts: true
  script:
    - |
      # Extract version from tag or package.json using bash
      if [[ $CI_COMMIT_TAG =~ ^release-cli-(.+)$ ]]; then
        RELEASE_VERSION="${BASH_REMATCH[1]}"
      else
        RELEASE_VERSION=$(grep -o '"version": *"[^"]*"' package.json | cut -d'"' -f4)
      fi
    - 'echo "Publishing standalone version: $RELEASE_VERSION"'
    - ls -la dist/standalone/
    - s3cmd put dist/standalone/* s3://${AWS_BUCKET_DIR}/nessy-cli/standalone/${RELEASE_VERSION}/
    - |
      cat > manifest.json << EOF
      {
        "version": "${RELEASE_VERSION}",
        "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
        "commit": "${CI_COMMIT_SHORT_SHA:-unknown}",
        "tag": "${CI_COMMIT_TAG:-manual}"
      }
      EOF
    - |
      if [[ ! "$RELEASE_VERSION" =~ -beta\. ]]; then
        s3cmd put dist/standalone/* s3://${AWS_BUCKET_DIR}/nessy-cli/standalone/latest/
        s3cmd put manifest.json s3://${AWS_BUCKET_DIR}/nessy-cli/standalone/latest.json
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-cli-[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$/
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never

publish_desktop:
  stage: publish
  image: ${NODE_IMAGE}
  extends: .s3_creds
  needs:
    - job: build_desktop_macos_arm64
      artifacts: true
    - job: build_desktop_macos_x64
      artifacts: true
    - job: build_desktop_linux
      artifacts: true
    - job: build_desktop_windows
      artifacts: true
  before_script:
    - npm install -g bun
    - cd packages/desktop
    - bun install --frozen-lockfile --ignore-scripts
    - cd ../..
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        RELEASE_VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^release-desktop-//')
      else
        RELEASE_VERSION=$(node -p "require('./packages/desktop/package.json').version")
      fi
    - 'echo "Publishing desktop version: $RELEASE_VERSION"'
    - ls -la packages/desktop/apps/electron/release/
    - |
      cd packages/desktop
      bun run scripts/merge-macos-release-manifests.ts apps/electron/release
      if [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        sed -E \
          -e "s#__MACOS_EXPECTED_TEAM_ID__#$MACOS_EXPECTED_TEAM_ID#g" \
          -e "s#__MACOS_EXPECTED_BUNDLE_ID__#$MACOS_EXPECTED_BUNDLE_ID#g" \
          scripts/install-app.sh > scripts/install-app.rendered.sh
        mv scripts/install-app.rendered.sh scripts/install-app.sh
        bun run scripts/upload.ts --electron --version "$RELEASE_VERSION" --latest --script
      else
        bun run scripts/upload.ts --electron --version "$RELEASE_VERSION"
      fi
  rules: *release_desktop_rules

publish_audio_capture_prebuilds:
  stage: publish
  image: ${S3_TOOLS_IMAGE}
  needs:
    - job: build_audio_capture_prebuilds
      artifacts: true
  script:
    - |
      if [[ $CI_COMMIT_TAG =~ ^release-audio-capture-(.+)$ ]]; then
        RELEASE_VERSION="${BASH_REMATCH[1]}"
      else
        RELEASE_VERSION=$(grep -o '"version": *"[^"]*"' package.json | cut -d'"' -f4)
      fi
    - 'echo "Publishing audio-capture prebuilds version: $RELEASE_VERSION"'
    - find "${AUDIO_CAPTURE_PREBUILDS_DIR}" -maxdepth 3 -type f -print
    - test -n "$(find "${AUDIO_CAPTURE_PREBUILDS_DIR}" -name '*.node' -print -quit)"
    - s3cmd put --recursive "${AUDIO_CAPTURE_PREBUILDS_DIR}/" s3://${AWS_BUCKET_DIR}/nessy-cli/audio-capture/${RELEASE_VERSION}/prebuilds/
    - |
      cat > audio-capture-manifest.json << EOF
      {
        "version": "${RELEASE_VERSION}",
        "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
        "commit": "${CI_COMMIT_SHORT_SHA:-unknown}",
        "tag": "${CI_COMMIT_TAG:-manual}"
      }
      EOF
    - |
      if [[ ! "$RELEASE_VERSION" =~ -beta\. ]]; then
        s3cmd put --recursive "${AUDIO_CAPTURE_PREBUILDS_DIR}/" s3://${AWS_BUCKET_DIR}/nessy-cli/audio-capture/latest/prebuilds/
        s3cmd put audio-capture-manifest.json s3://${AWS_BUCKET_DIR}/nessy-cli/audio-capture/latest.json
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-audio-capture-[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$/
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never

prepare_async_build_args:
  stage: build
  image: ${NODE_IMAGE}
  script:
    - VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^release-[^-]*-//')
    - echo "NESSY_CLI_VERSION=${VERSION}" >> async_build.env
  artifacts:
    reports:
      dotenv: async_build.env
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-cli-/
      when: on_success

build_async_image:
  extends: .build_and_push_docker
  stage: build
  needs:
    - job: set_stable_version
      optional: true
      artifacts: true
    - job: prepare_async_build_args
      optional: true
      artifacts: true
  variables:
    PROPAGATE_IMAGE_REFS: 'true'
    IMAGE_NAME: nessy-async
    DOCKERFILE_PATH: async.Dockerfile
    CONTEXT_PATH: .
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^release-cli-/
      when: never
    # Stable CLI release only - tag as latest
    - if: $CI_COMMIT_TAG =~ /^release-cli-[0-9]+\.[0-9]+\.[0-9]+$/
      variables:
        IMAGE_TAG: 'latest'
        DOCKER_BUILD_ARGS: '--build-arg NESSY_CLI_VERSION=$NESSY_CLI_VERSION'
      when: on_success
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - async.Dockerfile
        - deploy/async/**/*
      variables:
        IMAGE_TAG: 'latest'
      when: on_success
    - changes:
        paths:
          - async.Dockerfile
          - deploy/async/**/*
        compare_to: refs/heads/master
      when: on_success

build_vscode_extension:
  stage: build
  image: ${NODE_IMAGE}
  script:
    # Install native modules for Linux (npm/cli#4828 optional dependencies bug)
    # Rollup and esbuild need platform-specific native binaries for bundling
    - npm ci --ignore-scripts
    - npm i --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    - npm run build:vscode
    - node -e 'const fs=require("fs");const pkg=require("./packages/vscode-ide-companion/package.json");const base="https://s3-msk.tinkoff.ru/nestor-companion/vscode";const vsix=`nessy-cli-vscode-ide-companion-${pkg.version}.vsix`;const payload={version:pkg.version,vsixUrl:`${base}/${vsix}`};fs.writeFileSync("packages/vscode-ide-companion/latest.json",JSON.stringify(payload,null,2)+"\n");fs.writeFileSync("packages/vscode-ide-companion/build-variables.sh",`VSCODE_VERSION=${pkg.version}\nVSIX_FILENAME=${vsix}\n`);'
  artifacts:
    paths:
      - packages/vscode-ide-companion/*.vsix
      - packages/vscode-ide-companion/latest.json
      - packages/vscode-ide-companion/build-variables.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/vscode-ide-companion/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^release-cli-/
      when: never
    - when: on_success

plugin_intellij_webview_build:
  stage: build
  image: ${NODE_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/intellij-ide-companion/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $COMPONENT_TYPE != "cli"
      when: never
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^release-cli-/
      when: never
    - when: on_success
  script:
    # Install native modules for Linux (npm/cli#4828 optional dependencies bug)
    # Rollup and esbuild need platform-specific native binaries for bundling
    - npm ci --ignore-scripts
    - npm i --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    # Build all packages first (channel packages, web-templates, etc. are required for bundling)
    - npm run build
    - npm run build:vscode
  artifacts:
