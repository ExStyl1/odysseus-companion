# The aws publish image has no node, so the docs build runs in the node
# image and hands the static output over as an artifact.
build-docs:
  stage: build
  image: ${NODE_IMAGE}
  needs: []
  rules:
    # Auto-build when docs content/config lands on the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs-site/**/*
        - scripts/publish-docs-dev.sh
    # Manual escape hatch on the default branch or release tags.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/
      when: manual
      allow_failure: true
  script:
    - bash scripts/publish-docs-dev.sh --dry-run
  artifacts:
    paths:
      - docs-site/content/.vitepress/dist/
    expire_in: 1 week

publish-docs-dev:
  stage: publish
  image: docker-hosted.artifactory.tcsbank.ru/ded-dms/ci-aws:latest
  needs:
    - job: build-docs
      artifacts: true
  rules:
    # Auto-publish when docs content/config lands on the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs-site/**/*
        - scripts/publish-docs-dev.sh
    # Manual escape hatch on the default branch or release tags.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/
      when: manual
      allow_failure: true
  variables:
    AWS_ACCESS_KEY_ID: "$S3_DEV_ACCESS_KEY"
    AWS_SECRET_ACCESS_KEY: "$S3_DEV_SECRET_KEY"
    AWS_EC2_METADATA_DISABLED: "true"
    NESSY_DESKTOP_DOCS_SKIP_BUILD: "true"
  script:
    - bash scripts/publish-docs-dev.sh
