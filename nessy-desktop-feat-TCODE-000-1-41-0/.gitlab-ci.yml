# CI/CD pipeline for Nessy Desktop (Electron + React + Bun monorepo).

include:
  - template: Security/SAST.gitlab-ci.yml
  # Hidden `.apphub` upload job (contract: docs/universal/hidden_jobs.md there).
  - project: mobile-dev-platform/pipelines
    ref: v2
    file:
      - universal/utils/apphub.yml

# The SAST template pulls analyzer images from registry.gitlab.com, which the
# cluster's registry admission policy denies (the job dies as a system failure
# before any scan runs). Keep the job non-blocking until a mirrored analyzer
# image exists (then point SECURE_ANALYZERS_PREFIX at it and drop this).
semgrep-sast:
  allow_failure: true

variables:
  NPM_CONFIG_CACHE: "${CI_PROJECT_DIR}/.npm"
  NPM_CONFIG_REGISTRY: "https://artifactory.tcsbank.ru/artifactory/api/npm/npm-all/"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  BUN_INSTALL_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/bun"
  ELECTRON_CACHE: "${CI_PROJECT_DIR}/.cache/electron"
  ELECTRON_BUILDER_CACHE: "${CI_PROJECT_DIR}/.cache/electron-builder"

  NODE_IMAGE: docker-hosted.artifactory.tcsbank.ru/cicd-images/nodejs-22:latest

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - install
  - lint
  - test
  - build
  - release
  - publish

default:
  tags:
    - dp-build-k8s
    - medium

.branch-rules: &branch-rules
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.bun-cache:
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .npm/
      - .cache/bun/
      - .cache/electron/
      - .cache/electron-builder/

.bun-job:
  image: ${NODE_IMAGE}
  extends: .bun-cache
  before_script:
    - node --version
    - npm --version
    # 1.3.14, the version every developer machine and every measured trap in AGENTS.md
    # runs on. Until 2026-09-20 this said 1.3.9, and on 1.3.9 the `test` job has NEVER
    # completed on this MR: five of five runs (pipelines 126347476, 126365816, 126373018,
    # 126373772, 126373774) died with `panic(main thread): Segmentation fault at address
    # 0x0` — "Bun has crashed. This indicates a bug in Bun, not your code" — after
    # ~530–570 s, ~1 300 of ~2 270 test files, at the SAME file every time
    # (`pi-bundle-untrusted-text-ledger.test.ts` the last header printed), Peak RSS
    # 2.3 GB on a 6.3 GB runner, and printed no `Ran N tests` line, so every "N fail"
    # read off those logs was a reading of the files that ran before the crash. The
    # lift is a HYPOTHESIS verified by this job's next run (D1.437); the fallback if it
    # holds on 1.3.14 is splitting the whole-repo `bun test` into per-directory
    # processes, which is how AGENTS.md says the suite is run on a developer machine.
    - npm i -g bun@1.3.14
    - bun --version

install-bun:
  stage: install
  extends: .bun-job
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "true"
  script:
    - bun install --frozen-lockfile
    # D1.440 — ripgrep is a PRECONDITION of the P3.272 search suites, and it is
    # asserted here rather than met as a denied-path REGRESSION three jobs later.
    # Without it those suites fail carrying the tool's own refusal ("This tool
    # requires `rg`…"), POSITIVE CONTROLS included, so every "withheld"
    # assertion beside them is vacuous rather than merely red. That is what the
    # first chunked pipeline reported, for this reason and no other.
    #
    # `bun pm trust @vscode/ripgrep` is NOT the remedy and was measured wrong
    # here on 2026-09-20: at 1.18.0 that package declares no `scripts` at all —
    # the binary moved into a per-platform OPTIONAL dependency
    # (`@vscode/ripgrep-<platform>-<arch>`), exported as `rgPath` — so bun
    # answers "already trusted, don't have scripts to run, or don't exist" and
    # EXITS 1, failing the install job and skipping every job after it. The
    # package is in this repo's `trustedDependencies` in any case.
    #
    # So the check is the package's OWN contract, which is platform-independent
    # and fails with the resolver's own message naming the missing platform
    # package. AGENTS.md's §Traps bullet prescribing the trust command predates
    # the 1.18.0 layout.
    - bun -e 'const m = await import("@vscode/ripgrep"); const fs = await import("node:fs"); fs.statSync(m.rgPath); console.log("ripgrep resolved at " + m.rgPath)'
  <<: *branch-rules
  artifacts:
    paths:
      # The ROOT tree alone is not the install. bun hoists what it can and
      # leaves a NESTED copy wherever a workspace declares a range the hoisted
      # version does not satisfy — five workspaces declare `@types/node`
      # `^22.0.0` against the root's `^25.0.8`, and bun writes 22.19.21 into
      # each of their own `node_modules/` (measured 2026-09-19: eleven
      # workspaces carry one, 326 MiB against the root's 2.4 GiB). `node_modules/`
      # matches only the root directory, so every downstream job was running
      # against an install missing all eleven, and
      # `scripts/check-workspace-dependency-shadowing.test.ts` said so: 83
      # findings, every one `nested: false`, i.e. "this workspace resolves the
      # hoisted 25.9.4 and its own range forbids it". It passes locally, where
      # the nested copies exist, which is why this looked like a CI-only defect
      # rather than a truncated artifact.
      - node_modules/
      - packages/*/node_modules/
      - apps/*/node_modules/
    expire_in: 2 hours

typecheck:
  stage: lint
  extends: .bun-job
  needs:
    - job: install-bun
      artifacts: true
  script:
    - bun run typecheck:all
  <<: *branch-rules

lint:
  stage: lint
  extends: .bun-job
  # A FULL clone, for the same reason the `test` job has one: `lint:chain` also
  # runs gates that are HISTORICAL, and a shallow fetch does not make them fail
  # honestly, it makes them fail as though the tree were wrong.
  #
  # `lint:plan-shas` (`scripts/sort-plan-tracker.py --shas`) resolves EVERY
  # commit cell of every plan tracker — 4 218 sha tokens over 146 plans, measured
  # 2026-09-19 — and under the default depth-20 fetch it reported rows in
  # `2026-07-27-monitor-and-idle-wake.md` and
  # `2026-07-27-retention-and-checkpoint-gc.md` as citing shas "which name no
  # commit" (CI job 630556769). The control that this is the fetch and not the
  # plans: on a full local clone the same four shas all answer `commit` to
  # `git cat-file -t`, and the gate exits 0 with "every commit cell resolves".
  #
  # Cost, and it is the same one the `test` job pays and states: 6 269 commits,
  # `size-pack` 2.28 GiB. `typecheck` and `build-desktop` keep the shallow
  # default — neither reads history.
  variables:
    GIT_DEPTH: "0"
  needs:
    - job: install-bun
      artifacts: true
  script:
    - python3 --version   # lint:chain ends with two python steps; fail HERE, naming the cause
    # EVERY remote head, not only this one — and one of them is an ARCHIVE. A full
    # clone of ONE ref is not enough for `lint:plan-shas`: on the pipeline for
    # 79d138af1 (GIT_DEPTH 0 already in force) it reported 207 PHANTOM shas. The
    # first reading (2026-09-20, d4f6b8c04) said they were reachable from four
    # origin branches and this fetch would settle it; the next pipeline
    # (126365816) was red on the same 207, because that reading came from STALE
    # remote-tracking refs — a pruning fetch deleted origin/update/master on the
    # spot, and re-measured 0 of the 207 are on ANY origin branch: all of them
    # live only on developer-local branches whose merge requests were
    # squash-merged and whose source branches origin no longer carries. No fetch
    # brings what origin does not have, so the commits were made reachable from a
    # ref origin DOES carry: `archive/plan-cited-history` (86f407b9a), one commit
    # whose tree holds only the two compliance files the push rule reads and whose
    # five parents are the tips of the covering local branches (645 commits). This
    # fetch then resolves every cited sha; no plan cell is edited to fit the
    # fetch. `--no-tags` keeps it from pulling release tags the gate does not read.
    # Control: `git merge-base --is-ancestor <sha> origin/archive/plan-cited-history`
    # answers yes for all 207 (D1.423).
    - git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
    - bun run lint
    - bun run lint:i18n:parity
    - bun run lint:i18n:sorted
  <<: *branch-rules

# The THIRD line is not decoration and must not be folded into the first.
# `bun test` discovers by FILENAME — it prints the rule itself when a filter
# misses: Tests need .test, _test_, .spec or _spec_ in the filename — so the ten
# `*.isolated.ts` suites were collected by nothing and reached CI through
# nothing. They are isolated on purpose (each mutates process
# state or spawns a child that must not share a runner), which is why they run
# one file per `bun test` invocation instead of joining the first line.
#
# `bun run test:isolated` rather than `bun run test`: the root `test` script is
# `bun test && bun run test:isolated`, so calling it here would run the whole
# repo suite twice. The script refuses to report success when it finds zero
# files — a green run over nothing is the exact failure this job exists to end
# (P3.354).
test:
  stage: test
  extends: .bun-job
  # A FULL clone, for this job and no other. Several gates in `scripts/` are
  # historical controls: they resolve a named commit and assert what the tree
  # carried there, because a gate that cannot be shown going red on the defect
  # it was written for is indistinguishable from no gate. Under the default
  # depth-20 fetch those commits are simply absent, and every one of them fails
  # with `fatal: Not a valid object name` — a fetch setting reading as six test
  # failures (`check-nul-bytes` at `de52b1fac`, `check-shape-pointer-reasons` at
  # `b377320e6` / `4f1a6a451` / `e03ba84b9`, `scripts/cdp/harness.test.ts`'s
  # `implementedBy` ancestry). All six pass on a full local clone.
  #
  # The cost, measured 2026-09-19: 6 269 commits, `size-pack` 2.28 GiB, paid
  # once per run of this one job (`typecheck`, `lint` and `build-desktop` keep
  # the shallow default).
  #
  # A bounded depth was refused rather than tuned. Today's controls are 181-394
  # commits back, so `GIT_DEPTH: 1000` would work — and would break silently the
  # day a control's commit ages past it, with the same `Not a valid object name`
  # that reads as a broken test. The controls are deliberate and must not be
  # weakened to fit the fetch.
  variables:
    GIT_DEPTH: "0"
  needs:
    - job: install-bun
      artifacts: true
  script:
    # D1.437 / D1.440 — one `bun test` process for the whole repository was the
    # shape of both failures this job has had. On bun 1.3.9 five runs in a row
    # died with `panic(main thread): Segmentation fault` after ~530-570 s at
    # ~1 300 of ~2 270 files, printing no `Ran N tests` line, so the job failed
    # naming no test and ~970 files were never reached by any of the five. The
    # lift to 1.3.14 stopped the crash and the first completed run then reported
    # 66 failures, 51 of which PASS when the file is run alone — cross-file
    # pollution of a 2 274-file batch (`mock.module` without a spread-and-
    # restore, module-scope env mutation), which is exactly what AGENTS.md says
    # a batch this size does on a developer machine.
    #
    # `ci-test-chunks.ts` runs one process per DIRECTORY, enumerated from
    # `git ls-files` so there is no list to maintain, and refuses to report
    # success unless the summed file count equals the tracked count — a chunk
    # that ran zero files, a file in no chunk and a file in two chunks are each
    # a named failure rather than a smaller number that reads like an answer. A
    # crash now takes out one directory and the rest still report.
    #
    # `test:isolated` stays exactly where it was, as its own script line below:
    # those suites already run one process per FILE (P3.354), which is what a
    # suite gets when it cannot share a process even with its own directory.
    # EVERY remote head, exactly as the `lint` job fetches them, because this job
    # ALSO reads history: the historical-control cases in `scripts/` (the NUL-byte
    # and shape-pointer controls, `ROW_ARTEFACT_MARKERS`'s "every commit resolves")
    # run `git ls-tree <sha>` against commits the plans cite. Measured 2026-09-20 on
    # master pipeline 126387848 (`04e335f1e`, the squash of MR !48): the merge
    # DELETED the source branch on origin, so every sha of that branch's history
    # left every origin ref, `lint:plan-shas` refused 3 884 cells and this job's
    # `scripts` chunks failed 5 cases with `Command failed: git ls-tree -r
    # --name-only de52b1fac` — while the same content was green on the branch,
    # where those commits were ancestors of the ref being built. The commits live
    # on `archive/plan-cited-history` (extended with the merged tip at every merge;
    # see the lint job's comment), and this fetch is what makes a full clone of
    # ONE ref able to see them. `--no-tags` as in `lint`.
    - git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
    - bun scripts/ci-test-chunks.ts
    - bun run test:shared:all
    - bun run test:isolated
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week
  <<: *branch-rules

# The strongest check that exists on `packages/codex-protocol`: regenerate the
# bindings from the PINNED codex binary and diff every generated file plus the
# protocol schema (655 + 289 files, counted 2026-09-03 — read the directories,
# not this number). P3.258, owner decision §G2: *"Run the codex regeneration
# diff as a scheduled/manual job outside the hermetic pipeline — not in the main
# pipeline, not left off."* It had been commented out since Codex went
# default-off, which made the only wholesale check on a wire contract a thing
# run by hand and remembered by nobody.
#
# No weaker in-pipeline substitute is offered, deliberately. P3.155 measured that
# a typecheck gates one shape and misses the one a hand-restated wire contract
# actually suffers, and the exclusion's own reason in
# `scripts/check-typecheck-coverage.ts` now says so; a green weaker gate here
# would be worse than the honest null.
#
# MANUAL rather than automatic because it is networked and this pipeline is
# otherwise hermetic: it fetches the full `codex` release tarball from
# github.com, for which this fleet has no artifactory mirror (the tarball is a
# release asset — see the PROVENANCE block in `scripts/fetch-codex.mjs` for why
# no registry pin can substitute for it). Manual means it never runs unpressed —
# and NON-BLOCKING (`allow_failure: true`) is what makes it never block an MR,
# which the `allow_failure:exit_codes` form this job carried until 2026-09-20
# did NOT give: measured that day on MR !50, whose every pipeline finished all
# four gates green and then sat in status `manual` (BLOCKED) on this job, so
# auto-merge never fired and the owner could not merge — a release waited on it.
# GitLab's `ci/yaml/#allow_failure`: "The default value for `allow_failure` is:
# `true` for manual jobs. `false` for jobs that use `when: manual` inside
# `rules`." — this job's `when: manual` IS inside `rules` — and `exit_codes` is
# "`allow_failure: true` for any of the listed exit codes, and `allow_failure`
# false for any other exit code", which is the blocking form: "You can use
# `allow_failure: false` with a manual job to create a blocking manual job."
#
# The `schedule` arm is deliberate and TODAY INERT, which is said here rather
# than discovered later: `workflow.rules` at the top of this file admits only
# merge_request_event, tag and branch pipelines, so a scheduled pipeline creates
# no jobs at all. Admitting schedules is an infra decision this job must not make
# on its own — a scheduled pipeline sets CI_COMMIT_BRANCH, so every `*branch-rules`
# job in this file would start running on the schedule too. The arm is written so
# that the day that entry is added, this job fires with no further edit.
#
# The preflight exists because the exit code otherwise CANNOT distinguish the two
# verdicts this job reaches, and one of them is not about the bindings at all: a
# runner that cannot reach github.com exits 75 (an EGRESS verdict — nothing was
# checked), while real drift exits 1. Since 2026-09-20 the whole job is
# `allow_failure: true`, so NEITHER exit reds the PIPELINE — the pipeline colour
# can no longer tell the two apart, and the JOB's own colour and log are where
# the verdict lives (a red job that exited 1 is drift; 75 is egress). That is the
# price of a manual job that does not block a merge, paid knowingly: the only
# other form, `allow_failure:exit_codes`, is the blocking one named above. Do not
# collapse the two exits, and do not make the unreachable case exit 0: a job that
# reports success when it never ran is the exact failure this row exists to end.
codex-protocol-regeneration-diff:
  stage: test
  image: ${NODE_IMAGE}
  # `check-codex-schema.mjs` imports node builtins only, so this needs neither
  # `bun install` nor the install-bun artifacts.
  needs: []
  # `true`, not `exit_codes: [75]` — the exit-code form is a BLOCKING manual job
  # (the header above measures what that cost); the 1-vs-75 distinction survives
  # in the job's exit code and log, not in the pipeline's colour.
  allow_failure: true
  script:
    - |
      tag="$(node -p "require('./packages/codex-protocol/manifest.json').upstream.tag")"
      url="https://github.com/openai/codex/releases/download/${tag}/codex-package_SHA256SUMS"
      if ! curl -fsS --max-time 30 --retry 2 -o /dev/null "$url"; then
        echo "PREREQUISITE ABSENT: this runner cannot reach ${url}"
        echo "That is an EGRESS verdict, not a drift verdict - nothing about"
        echo "packages/codex-protocol was checked. Exiting 75 so this reads as"
        echo "amber rather than as a clean regeneration."
        exit 75
      fi
    - node scripts/check-codex-schema.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual

# test-doc-tools is intentionally disabled until runner mirrors are ready:
# it needs uv, CPython 3.12, and PyPI packages from Artifactory
# (UV_INDEX_URL and UV_PYTHON_INSTALL_MIRROR). Phase 6 stages uv locally for
# release packaging; CI doc-tool coverage should be re-enabled after the mirror
# endpoints are confirmed by infra.
# test-doc-tools:
#   stage: test
#   extends: .bun-job
#   needs:
#     - job: install-bun
#       artifacts: true
#   script:
#     - python3 --version
#     - bun run test:doc-tools
#   <<: *branch-rules

build-desktop:
  stage: build
  extends: .bun-job
  needs:
    - job: install-bun
      artifacts: true
  script:
    - bun run electron:build
  artifacts:
    paths:
      - apps/electron/dist/
    expire_in: 1 week
  <<: *branch-rules

# Automatic release:
#   git push origin v1.2.3
# Manual release:
#   CI/CD -> Run pipeline from the default branch with APP_VERSION=1.2.3
#
# Required protected CI/CD variables:
#   TCS_APPHUB_CREDENTIAL_READER_SERVICE_ACCOUNT (File) - AppHub Credential Reader service account JSON
#   TCS_APPHUB_DISTRIBUTION_SIGNER_SERVICE_ACCOUNT (File) - AppHub Distribution Signer service account JSON
#
# Defaults used by Fastlane unless overridden in GitLab/Spirit variables:
#   TCS_APPHUB_TEAM=ru.tfinance
#   TCS_APPHUB_MATCH_TENANT=nessy-desktop
#   NESSY_DESKTOP_RELEASE_ARCH=arm64
#   NESSY_DESKTOP_RELEASE_TARGETS=dmg,zip
#   NESSY_DESKTOP_RELEASE_SKIP_SMOKE=true
# F17 — does the `macos` runner actually build this app?
#
# There was no iOS job at all, so nobody had ever proved it. The runner image is
# documented as supporting Xcode builds, simulators and TestFlight, but it
# deliberately does NOT name its Xcode version — and this project is written
# against Xcode 26.2 / Swift 6.2.3. This job answers that question and needs no
# secret, no certificate and no App Store Connect access to do it.
#
# Deliberately its OWN rules rather than `.branch-rules`: the desktop and the
# phone must not both build on every pipeline. It runs when `apps/ios/**`
# changes, and can always be started by hand.
build-ios:
  stage: build
  tags:
    - macos
  timeout: 45 minutes
  dependencies: []
  # Starts immediately instead of waiting out install → lint → test. This job
  # touches no bun, no node_modules and no artifact from any of them — it is
  # Xcode and SwiftPM only. Measured on the first run: the k8s stages were still
  # queued twenty minutes in, which is a long time to wait for an answer that
  # does not depend on them.
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/ios/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/ios/**/*
    # Escape hatch: the toolchain question is worth asking without touching the app.
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/ios/toolchain.txt
  script:
    # The point of the job. Printed first and kept as an artifact, so the answer
    # survives even if a later step fails.
    - |
      {
        echo "macOS:    $(sw_vers -productVersion) ($(uname -m))"
        echo "Xcode:    $(xcodebuild -version | tr '\n' ' ')"
        echo "Swift:    $(swift --version 2>&1 | head -1)"
        echo "SDKs:     $(xcodebuild -showsdks 2>/dev/null | grep -i iphonesimulator | tr -s ' ' | tr '\n' ';')"
        echo "Runtimes: $(xcrun simctl list runtimes 2>/dev/null | grep -i ios | tr -s ' ' | tr '\n' ';')"
      } | tee apps/ios/toolchain.txt
    # The project is committed, so xcodegen is NOT required. If the image has it,
    # regenerate so a stale checked-in project cannot mask a project.yml change.
    - |
      if command -v xcodegen >/dev/null 2>&1; then
        echo "xcodegen present — regenerating"
        (cd apps/ios/NessyMobile && xcodegen generate)
      else
        echo "xcodegen absent — using the committed .xcodeproj"
      fi
    # Kit first: it is plain SwiftPM and fails fastest if the toolchain is wrong.
    - cd apps/ios/NessyAgentKit && swift build && swift test && cd -
    # Ask xcodebuild which simulators work with THIS scheme, rather than taking
    # the first one `simctl` happens to list. Measured on the first CI run: that
    # was an iPhone 14 Pro on iOS 17.2, below the project's deployment target,
    # so xcodebuild refused a destination the runner genuinely had. The tool's
    # own list is the only authority on what it will accept.
    - |
      cd apps/ios/NessyMobile
      DEVICE=$(xcodebuild -project NessyMobile.xcodeproj -scheme NessyMobile -showdestinations 2>/dev/null \
        | grep -E 'platform:iOS Simulator' \
        | grep -oE 'id:[0-9A-F-]{36}' | cut -d: -f2 | head -1)
      if [ -z "$DEVICE" ]; then
        echo "This runner offers no iOS Simulator destination for the NessyMobile scheme."
        echo "That is an ENVIRONMENT gap, not a code one — a question for mobile-devplatform."
        echo "Do NOT lower the deployment target to make it pass."
        xcodebuild -project NessyMobile.xcodeproj -scheme NessyMobile -showdestinations 2>&1 | head -40
        exit 1
      fi
      echo "Using simulator $DEVICE"
      xcodebuild -project NessyMobile.xcodeproj -scheme NessyMobile -destination "id=$DEVICE" build
      xcodebuild -project NessyMobile.xcodeproj -scheme NessyMobile -destination "id=$DEVICE" test

# AppHub distribution — WIP, manual-only. Blocked inputs, in order (see
# docs/superpowers/plans/2026-08-09-mobile-followups.md, §AppHub corrections):
# apple-portal-services MR !867 merged (registers
# ph.princess.frog-2.nessy-desktop.NessyMobile), at least one device
# registered in CodeSign under ph.princess.frog-2 (an adhoc profile refuses
# to issue without one), and protected-ref secrets
# (TCS_APPHUB_DISTRIBUTION_SIGNER_SERVICE_ACCOUNT and APPHUB_SA_KEY_FILE are
# protected variables, absent on feature branches).
build-ios-adhoc:
  stage: build
  tags:
    - macos
  timeout: 45 minutes
  dependencies: []
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - |
      if command -v xcodegen >/dev/null 2>&1; then
        (cd apps/ios/NessyMobile && xcodegen generate)
      fi
    - cd fastlane && BUNDLE_PATH=vendor/bundle bundle install && cd ..
    - cd fastlane && BUNDLE_PATH=vendor/bundle bundle exec fastlane ios build_adhoc
  artifacts:
    paths:
      - release-ios/NessyMobile.ipa
    expire_in: 1 week

# Uploads the .ipa to AppHub (Spirit → Сборка → Мобильные сборки). The upload
# script inside the .apphub image reads the binary from the needs artifacts
# and emits apphub.env with APPHUB_BUILD_PAGE_URL.
apphub-upload:
  stage: release
  extends: .apphub
  variables:
    APPHUB_BUILD_TYPE: qa
  needs:
    - job: build-ios-adhoc
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

release-macos:
  stage: release
  tags:
    - macos
  timeout: 60 minutes
  dependencies: []
  cache:
    - key:
        files:
          - bun.lock
        prefix: $CI_RUNNER_EXECUTABLE_ARCH-bun
      paths:
        - .npm/
        - .cache/bun/
        - .cache/electron/
        - .cache/electron-builder/
    - key:
        files:
          - fastlane/Gemfile
          - fastlane/Pluginfile
        prefix: $CI_RUNNER_EXECUTABLE_ARCH-fastlane
      paths:
        - fastlane/vendor/bundle/
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - git config --global credential.helper ""
    - node --version
    - npm --version
    - npm i -g bun@1.3.14
    - export PATH="$(npm prefix -g)/bin:$PATH"
    - bun --version
    - ELECTRON_SKIP_BINARY_DOWNLOAD=true bun install --frozen-lockfile
    - cd fastlane && BUNDLE_PATH=vendor/bundle bundle install && cd ..
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tag pipeline: version comes from the vX.Y.Z tag.
        APP_VERSION="${CI_COMMIT_TAG#v}"
      elif [ -n "${APP_VERSION:-}" ]; then
        # Explicit override (Run pipeline with an APP_VERSION variable).
        :
      else
        # Manual master run without a tag/override: take the version from
        # package.json so no one has to type APP_VERSION by hand. Bump it with
        # `npm run release:patch|minor|beta` (or a tag) to cut a new version.
        APP_VERSION="$(node -p "require('./package.json').version")"
        echo "No tag/APP_VERSION; using package.json version $APP_VERSION"
      fi
      echo "APP_VERSION=$APP_VERSION" >> version.env
      echo "Building Nessy Desktop $APP_VERSION"
    - npm pkg set version="$APP_VERSION"
    - cd apps/electron && npm pkg set version="$APP_VERSION" && cd ../..
    - export NESSY_DESKTOP_UPDATE_URL="$NESSY_DESKTOP_DEV_UPDATE_URL"
    - export NESSY_DESKTOP_UPDATE_CHANNEL=dev
    - cd fastlane && BUNDLE_PATH=vendor/bundle bundle exec fastlane mac package_signed_electron version:"$APP_VERSION" arch:"${NESSY_DESKTOP_RELEASE_ARCH:-arm64}" targets:"${NESSY_DESKTOP_RELEASE_TARGETS:-dmg,zip}"
  artifacts:
    reports:
      dotenv: version.env
    paths:
      - release/**/*.dmg
      - release/**/*.zip
      - release/**/*.yml
      - release/**/*.blockmap
    expire_in: 30 days

# Windows and Linux release jobs are PARKED, and not merely for want of a tag.
# Investigated 2026-08-07 because "just turn Windows on if the runner allows"
# is a reasonable-sounding ask with a non-obvious answer. Two independent
# blockers, both outside this file:
#
#   1. No Windows runner has ever existed here. Replaying every historical
#      revision of this file gives exactly three runner tags in the project's
#      whole CI history: `dp-build-k8s`, `medium` (the default Linux/k8s fleet)
#      and `macos`. The original `release-win` (72c2571af) had no `tags:` either
#      — it was written speculatively and parked 11 days later. Uncommenting it
#      as written runs PowerShell in a Linux container and fails at once.
#      Contrast `release-macos` below, which DOES carry `tags: [macos]`: this
#      project does use a non-default tag when the fleet exists.
#
#   2. Cross-building Windows on the Linux fleet is blocked by EGRESS, not by
#      native-binary availability — which is the opposite of what one expects.
#      The per-platform natives are all fine: koffi ships every platform in one
#      tarball, and `@anthropic-ai/claude-agent-sdk-win32-x64` and
#      `@vscode/ripgrep-win32-x64` are both in bun.lock from artifactory
#      (build-win.ps1 already cross-fetches the SDK one, the same way
#      build-dmg.sh does for darwin-x64). What is NOT fine is that a Windows
#      artifact needs FOUR github.com release downloads with no artifactory
#      mirror configured. This list said five until 2026-09-03; the fifth is
#      struck through below because it was measured to have an artifactory
#      source, and a blocker list that over-counts is how a park outlives its
#      reason (P3.282):
#        - bun-windows-x64-baseline.zip   (build-win.ps1, URL hard-coded; the
#          macOS path has BUN_DOWNLOAD_BASE_URL, the PowerShell one does not)
#        - [RESOLVED 2026-09-03] the Windows restricted-token
#          sandbox trio (scripts/fetch-codex.mjs --windows-sandbox), which is
#          MANDATORY regardless of every feature flag — build-win.ps1 throws
#          without it. It was described here as the same github.com tarball the
#          regeneration-diff note above records this fleet as unable to fetch.
#          That is no longer the only source. Measured twice (S0-2, then
#          independently 2026-09-03): all three files inside
#          `@openai/codex@0.148.0-win32-x64`, fetched through THIS pipeline's own
#          NPM_CONFIG_REGISTRY (`.../api/npm/npm-all/@openai/codex/-/codex-0.148.0-win32-x64.tgz`,
#          HTTP 200, 130052468 bytes, tarball sha1 3a0da92b… matching the
#          packument), are byte-identical to the manifest pins:
#            package/vendor/x86_64-pc-windows-msvc/bin/codex.exe            → 2ad2cf8a…
#            package/vendor/…/codex-resources/codex-command-runner.exe      → d90ed117…
#            package/vendor/…/codex-resources/codex-windows-sandbox-setup.exe → cce5d63a…
#          Integrity is unchanged by the switch: `manifest.json`
#          `windowsSandbox.win32-x64.files[*].binarySha256` stays the gate, and
#          the per-file check in `fetchWindowsSandboxTarget` already enforces it
#          — only the ARCHIVE-level trust anchor moves from the release
#          SHA256SUMS to the registry tarball's own digest.
#          Note the asymmetry, because it is the trap: this works for the
#          sandbox trio and CANNOT work for `codex-app-server`. npm publishes
#          `variant: "codex"` only; the app-server variant is a release asset
#          and no registry pin at any version reproduces it (PROVENANCE block,
#          `scripts/fetch-codex.mjs`). The script change is one lane over —
#          `scripts/` is not this row's zone — so the measurement is recorded
#          here; scripts/fetch-codex.mjs now defaults to
#          --windows-sandbox-source=npm and reads them through
#          NPM_CONFIG_REGISTRY. Four blockers remain.
#        - electron-v<ver>-win32-x64.zip  (ELECTRON_MIRROR unset)
#        - the NSIS toolset               (ELECTRON_BUILDER_BINARIES_MIRROR unset)
#        - winCodeSign                    (same)
#      NSIS additionally runs the built installer under Wine to produce the
#      uninstaller, and ${NODE_IMAGE} is a stock org Node image; per the semgrep
#      precedent at the top of this file, only artifactory-mirrored images pass
#      the cluster's admission policy. Even `--win --dir` (no NSIS, no Wine)
#      still needs the first three.
#
# To unpark, infra must supply EITHER a Windows runner with a tag, OR an
# artifactory-mirrored Wine-capable image plus remote proxies for those four
# assets (this sentence said five after the list above had already been corrected to four, 2026-09-03; caught by DA1.9, 2026-09-13), wired through ELECTRON_MIRROR, ELECTRON_BUILDER_BINARIES_MIRROR and
# new bun/codex base-URL overrides. When a Windows runner does appear,
# `release-win` needs two edits beyond uncommenting: add its `tags:`, and
# extend `.bun-cache` rather than `.bun-job` (the latter pins the Linux image).
#
# Keep the definitions here so they can be restored by uncommenting.
