# Dev update feed publish:
#   Build/sign/package in release-* first, then run the matching manual job.
#
# Required CI/CD variables:
#   S3_DEV_BUCKET
#   S3_DEV_ACCESS_KEY
#   S3_DEV_SECRET_KEY
#   S3_ENDPOINT
.publish-dev-template:
  stage: publish
  image: docker-hosted.artifactory.tcsbank.ru/ded-dms/ci-aws:latest
  variables:
    AWS_ACCESS_KEY_ID: "$S3_DEV_ACCESS_KEY"
    AWS_SECRET_ACCESS_KEY: "$S3_DEV_SECRET_KEY"
    AWS_EC2_METADATA_DISABLED: "true"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - |
      publish_dir="release-publish/${PUBLISH_PLATFORM}"
      publish_arches="${NESSY_DESKTOP_PUBLISH_ARCHES:-${NESSY_DESKTOP_RELEASE_ARCH:-${PUBLISH_DEFAULT_ARCH}}}"
      if command -v node >/dev/null 2>&1; then
        node --version
        node scripts/prepare-release-assets.mjs --artifacts-dir=release --out-dir="$publish_dir"
        for arch in $publish_arches; do
          node scripts/verify-update-feed.mjs \
            --release-dir="$publish_dir" \
            --platform="$PUBLISH_PLATFORM" \
            --arch="$arch" \
            --channel="${NESSY_DESKTOP_DEV_UPDATE_CHANNEL:-dev}"
        done
        echo "NESSY_DESKTOP_RELEASE_DIR=$publish_dir" > publish.env
      else
        echo "node is not available in the publish image; publishing release/ directly after bash artifact checks."
        echo "NESSY_DESKTOP_RELEASE_DIR=release" > publish.env
      fi
    - |
      # shellcheck disable=SC1091
      source publish.env
      NESSY_DESKTOP_RELEASE_DIR="$NESSY_DESKTOP_RELEASE_DIR" bash scripts/publish-dev.sh --platform="$PUBLISH_PLATFORM"
    - |
      # shellcheck disable=SC1091
      source publish.env
      publish_arches="${NESSY_DESKTOP_PUBLISH_ARCHES:-${NESSY_DESKTOP_RELEASE_ARCH:-${PUBLISH_DEFAULT_ARCH}}}"
      if command -v node >/dev/null 2>&1 && [ -n "${NESSY_DESKTOP_DEV_UPDATE_URL:-}" ]; then
        for arch in $publish_arches; do
          node scripts/verify-update-feed.mjs \
            --release-dir="$NESSY_DESKTOP_RELEASE_DIR" \
            --platform="$PUBLISH_PLATFORM" \
            --arch="$arch" \
            --channel="${NESSY_DESKTOP_DEV_UPDATE_CHANNEL:-dev}" \
            --base-url="$NESSY_DESKTOP_DEV_UPDATE_URL"
        done
      else
        echo "Skipping post-upload remote feed verification (node and/or NESSY_DESKTOP_DEV_UPDATE_URL unavailable)."
      fi

publish-macos-dev:
  extends: .publish-dev-template
  needs:
    - job: release-macos
      artifacts: true
  variables:
    PUBLISH_PLATFORM: "mac"
    PUBLISH_DEFAULT_ARCH: "arm64"
    NESSY_DESKTOP_DEV_RELEASE_PREFIX: "dev/mac"

