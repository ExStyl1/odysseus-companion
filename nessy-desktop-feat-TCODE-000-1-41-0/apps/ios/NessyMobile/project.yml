# apps/ios/NessyMobile/project.yml
name: NessyMobile
options:
  bundleIdPrefix: ph.princess.frog-2.nessy-desktop
  deploymentTarget:
    iOS: "18.0"
packages:
  NessyAgentKit:
    path: ../NessyAgentKit
targets:
  NessyMobile:
    type: application
    platform: iOS
    sources:
      - path: NessyMobile
        excludes: [Themes]
      # F13: a FOLDER reference, so `Themes/` survives into the bundle. Xcode
      # otherwise flattens it and `urls(forResourcesWithExtension:subdirectory:)`
      # finds nothing — the theme engine would be inert with no error anywhere.
      - path: NessyMobile/Themes
        type: folder
        buildPhase: resources
    dependencies:
      - package: NessyAgentKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: NessyMobile/NessyMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NessyMobile/Info.plist
      properties:
        CFBundleDisplayName: Nessy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        # iOS 14+ gates connections to local-network addresses behind a privacy
        # prompt; without this string the prompt cannot be shown at all.
        NSLocalNetworkUsageDescription: Nessy connects to the agent server running on your computer over the local network.
        # ATS blocks plain ws:// to a LAN address. This exception is scoped to
        # local networking — it does NOT relax ATS for the public internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # F5: the QR scanner, and the pairing link it replaces typing.
        NSCameraUsageDescription: Nessy scans the pairing QR code shown by the desktop app or printed by the server.
        CFBundleURLTypes:
          - CFBundleURLName: ph.princess.frog-2.nessy-desktop.pairing
            CFBundleURLSchemes: [nessy]
  NessyMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NessyMobileTests
    dependencies:
      - target: NessyMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
