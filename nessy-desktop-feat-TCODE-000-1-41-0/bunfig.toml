# This top-level list runs AHEAD of any `--preload` passed on the command line,
# and unified-network-interceptor.ts imports config/paths.ts transitively --
# which resolves CONFIG_DIR once, at import time. So the documented isolation
# recipe `bun --preload …/isolate-shared-config-dir.ts <file>` DOES NOT ISOLATE
# from this directory: the rig reads NESSY_CONFIG_DIR = <temp> while CONFIG_DIR
# is already frozen at the real ~/.nessy-agent, and reports success either way.
# Under `bun run` the flag is swallowed entirely and the preload never runs.
# Export NESSY_CONFIG_DIR BEFORE bun starts -- that works on every invocation
# form. Measured 2026-09-01 (P2.256); forms, controls and the copyable recipe in
# docs/superpowers/specs/2026-08-21-measured-traps.md. Do NOT "fix" this by
# adding the isolate file here: it would point every `bun run` -- builds,
# electron:dev -- at a throwaway config directory.
preload = ["./packages/shared/src/unified-network-interceptor.ts", "./apps/electron/testing/electron-mock-preload.ts"]

# `bun test` reads its preloads from the [test] table (the top-level `preload`
# above covers `bun run`). Mirror both entries here so the electron mock is
# applied during CI `bun test` too — without it, main-process suites that import
# `electron` at collection throw "Electron failed to install" on runners that
# skip the binary download.
#
# isolate-shared-config-dir.ts MUST run first: it points NESSY_CONFIG_DIR at a
# private temp directory before unified-network-interceptor.ts (which imports
# config/paths.ts transitively) can freeze CONFIG_DIR at the real machine's
# ~/.nessy-agent. See that file for why in-process tests must never depend on
# ambient host config state.
[test]
preload = ["./packages/shared/tests/setup/isolate-shared-config-dir.ts", "./packages/shared/src/unified-network-interceptor.ts", "./apps/electron/testing/electron-mock-preload.ts"]

# Use the hoisted linker so transitive deps resolve at top-level node_modules.
# Vite + esbuild bundling expects this layout; bun's default isolated linker
# leaves only declared deps at the workspace root, which breaks renderer imports
# of packages pulled in transitively (i18next, @tiptap/*, pdfjs-dist, etc.).
# Note: the Windows build script (scripts/build/common.ts) was already using
# `bun install --linker=hoisted` for the same reason.
[install]
registry = "https://artifactory.tcsbank.ru/artifactory/api/npm/npm-all/"
linker = "hoisted"
